<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PT 2.5 - Google Sign-In</title>

    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <meta name="google-signin-client_id"
          content="502778001252-hk11jlsrb74q6ju7qsaqijdn5l9rk61h.apps.googleusercontent.com">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, Helvetica, sans-serif;
            color: #f8fafc;
            background:
                radial-gradient(circle at top left, #2563eb 0, transparent 35%),
                radial-gradient(circle at bottom right, #7c3aed 0, transparent 35%),
                #0f172a;
        }

        .card {
            width: min(92%, 560px);
            padding: 48px;
            text-align: center;
            border: 1px solid rgba(255,255,255,.18);
            border-radius: 24px;
            background: rgba(15, 23, 42, .78);
            box-shadow: 0 25px 70px rgba(0,0,0,.45);
            backdrop-filter: blur(16px);
        }

        .logo {
            width: 72px;
            height: 72px;
            margin: 0 auto 24px;
            display: grid;
            place-items: center;
            border-radius: 20px;
            font-size: 34px;
            font-weight: bold;
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            box-shadow: 0 15px 35px rgba(59,130,246,.35);
        }

        h1 {
            margin: 0 0 14px;
            font-size: clamp(30px, 5vw, 44px);
        }

        .subtitle {
            margin-bottom: 32px;
            color: #cbd5e1;
            line-height: 1.6;
        }

        #missatge-benvinguda {
            margin: 24px 0;
            color: #93c5fd;
        }

        .g_id_signin {
            display: flex;
            justify-content: center;
        }

        #boto-sortir {
            margin: 24px auto 0;
            padding: 12px 28px;
            border: 0;
            border-radius: 12px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            color: white;
            background: linear-gradient(135deg, #ef4444, #dc2626);
            box-shadow: 0 10px 25px rgba(239,68,68,.25);
        }

        #boto-sortir:hover {
            transform: translateY(-2px);
        }

        .footer {
            margin-top: 34px;
            font-size: 13px;
            color: #64748b;
        }
    </style>
</head>

<body>
    <main class="card">
        <div class="logo">G</div>

        <h1>PT 2.5 - GOOGLE SIGN IN</h1>
        <p class="subtitle">
            Autenticació amb Google mitjançant OAuth 2.0
        </p>

        <h2 id="missatge-benvinguda" style="display:none;">
            Missatge de benvinguda
        </h2>

        <div id="g_id_onload"
             data-client_id="502778001252-hk11jlsrb74q6ju7qsaqijdn5l9rk61h.apps.googleusercontent.com"
             data-callback="onSignIn">
        </div>

        <div class="g_id_signin"
             data-type="standard">
        </div>

        <button id="boto-sortir"
                style="display:none;"
                onclick="signOut()">
            Desconnectar
        </button>

        <div class="footer">
            GitHub Pages · Google Identity Services · OAuth 2.0
        </div>
    </main>

    <script>
        function onSignIn(response) {
            var id_token = response.credential;

            console.log("ID Token: " + id_token);

            const dades = JSON.parse(decodeURIComponent(escape(atob(
                id_token.split('.')[1]
                    .replace(/-/g, '+')
                    .replace(/_/g, '/')
            ))));

            document.getElementById('missatge-benvinguda').textContent =
                'Benvingut/da, ' + dades.name;

            document.getElementById('missatge-benvinguda').style.display = 'block';
            document.getElementById('boto-sortir').style.display = 'block';
            document.querySelector('.g_id_signin').style.display = 'none';
        }

        function signOut() {
            document.getElementById('missatge-benvinguda').style.display = 'none';
            document.getElementById('boto-sortir').style.display = 'none';
            document.querySelector('.g_id_signin').style.display = 'flex';
        }
    </script>
</body>
</html>
