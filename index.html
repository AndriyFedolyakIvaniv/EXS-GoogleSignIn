<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PT 2.5 - Google Sign-In</title>

    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <meta name="google-signin-client_id"
          content="502778001252-hk11jlsrb74q6ju7qsaqjidn5l9rk61h.apps.googleusercontent.com">
</head>

<body>
    <h1>PT 2.5 - GOOGLE SIGN IN</h1>
    <p>Pàgina preparada per afegir OAuth 2</p>

    <h2 id="missatge-benvinguda" style="display:none;">
        Missatge de benvinguda
    </h2>

    <div id="g_id_onload"
         data-client_id="502778001252-hk11jlsrb74q6ju7qsaqjidn5l9rk61h.apps.googleusercontent.com"
         data-callback="onSignIn">
    </div>

    <div class="g_id_signin"
         data-type="standard">
    </div>

    <button id="boto-sortir"
            style="display:none;"
            onclick="signOut()">
        Desconnectar
    </button>

    <script>
        function onSignIn(response) {
            var id_token = response.credential;

            console.log("ID Token: " + id_token);

            const dades = JSON.parse(decodeURIComponent(escape(atob(
                id_token.split('.')[1]
                    .replace(/-/g, '+')
                    .replace(/_/g, '/')
            ))));

            document.getElementById('missatge-benvinguda').textContent =
                'Benvingut/da, ' + dades.name;

            document.getElementById('missatge-benvinguda').style.display = 'block';
            document.getElementById('boto-sortir').style.display = 'block';
            document.querySelector('.g_id_signin').style.display = 'none';
        }

        function signOut() {
            document.getElementById('missatge-benvinguda').style.display = 'none';
            document.getElementById('boto-sortir').style.display = 'none';
            document.querySelector('.g_id_signin').style.display = 'block';
        }
    </script>
</body>
</html>
